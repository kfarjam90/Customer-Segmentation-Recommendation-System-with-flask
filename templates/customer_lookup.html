<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Lookup</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Customer Lookup</h1>
        <a href="/" class="btn btn-secondary mb-4">Back to Dashboard</a>
        
        <div class="card">
            <div class="card-body">
                <form id="customerForm">
                    <div class="mb-3">
                        <label for="customerSelect" class="form-label">Select Customer:</label>
                        <select class="form-select" id="customerSelect" name="customer_id">
                            {% for customer_id in customer_ids %}
                            <option value="{{ customer_id }}">{{ customer_id }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Lookup</button>
                </form>
                
                <div id="customerInfo" class="mt-4" style="display: none;">
                    <h3>Customer Information</h3>
                    <table class="table table-striped">
                        <tr>
                            <th>Cluster:</th>
                            <td id="cluster"></td>
                        </tr>
                        <tr>
                            <th>Days Since Last Purchase:</th>
                            <td id="daysSince"></td>
                        </tr>
                        <tr>
                            <th>Total Transactions:</th>
                            <td id="totalTransactions"></td>
                        </tr>
                        <tr>
                            <th>Total Products Purchased:</th>
                            <td id="totalProducts"></td>
                        </tr>
                        <tr>
                            <th>Total Spend:</th>
                            <td id="totalSpend"></td>
                        </tr>
                        <tr>
                            <th>Average Transaction Value:</th>
                            <td id="avgTransaction"></td>
                        </tr>
                        <tr>
                            <th>Unique Products Purchased:</th>
                            <td id="uniqueProducts"></td>
                        </tr>
                    </table>
                    
                    <h4 class="mt-4">Recent Transactions</h4>
                    <table class="table table-striped" id="transactionsTable">
                        <thead>
                            <tr>
                                <th>Invoice No</th>
                                <th>Stock Code</th>
                                <th>Description</th>
                                <th>Quantity</th>
                                <th>Unit Price</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Transactions will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const customerId = formData.get('customer_id');
            
            fetch('/get_customer_data', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Display customer info
                document.getElementById('customerInfo').style.display = 'block';
                document.getElementById('cluster').textContent = data.cluster;
                document.getElementById('daysSince').textContent = data.days_since_last_purchase;
                document.getElementById('totalTransactions').textContent = data.total_transactions;
                document.getElementById('totalProducts').textContent = data.total_products_purchased;
                document.getElementById('totalSpend').textContent = '£' + data.total_spend.toFixed(2);
                document.getElementById('avgTransaction').textContent = '£' + data.avg_transaction_value.toFixed(2);
                document.getElementById('uniqueProducts').textContent = data.unique_products_purchased;
                
                // Populate transactions table
                const tbody = document.querySelector('#transactionsTable tbody');
                tbody.innerHTML = '';
                
                data.transactions.forEach(transaction => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${transaction.InvoiceNo}</td>
                        <td>${transaction.StockCode}</td>
                        <td>${transaction.Description}</td>
                        <td>${transaction.Quantity}</td>
                        <td>£${transaction.UnitPrice.toFixed(2)}</td>
                        <td>£${(transaction.UnitPrice * transaction.Quantity).toFixed(2)}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
